<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tạo form đơn giản</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .form-container {
            width: 500px;
            margin: 0 auto 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            width: 130px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="tel"],
        select {
            padding: 8px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .hobby {
            margin-left: 135px;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: #2196f3;
            color: white;
        }

        input[type="reset"] {
            background-color: #777;
            color: white;
        }
    </style>
</head>

<body>

    <!-- PHẦN 1 -->
    <div class="form-container">

        <h2>Thông tin cá nhân</h2>

        <form action="#" method="post">

            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label>Sở thích:</label>

                <div class="hobby">
                    <input type="checkbox" name="hobby" value="football">
                    Bóng đá
                    <br>

                    <input type="checkbox" name="hobby" value="music">
                    Âm nhạc
                    <br>

                    <input type="checkbox" name="hobby" value="reading">
                    Đọc sách
                    <br>

                    <input type="checkbox" name="hobby" value="travel">
                    Du lịch
                </div>
            </div>

            <div class="buttons">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>

        </form>

    </div>


    <!-- PHẦN 2 -->
    <div class="form-container">

        <h2>Đăng ký học viên</h2>

        <form action="#" method="post">

            <div class="form-group">
                <label for="fullName">Họ và tên:</label>
                <input type="text"
                       id="fullName"
                       name="fullName">
            </div>

            <div class="form-group">
                <label for="emailStudent">Email:</label>
                <input type="email"
                       id="emailStudent"
                       name="emailStudent">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel"
                       id="phone"
                       name="phone">
            </div>

            <div class="form-group">
                <label>Giới tính:</label>

                <input type="radio"
                       name="gender"
                       value="male">
                Nam

                <input type="radio"
                       name="gender"
                       value="female">
                Nữ
            </div>

            <div class="form-group">
                <label for="birthday">Ngày sinh:</label>
                <input type="date"
                       id="birthday"
                       name="birthday">
            </div>

            <div class="form-group">
                <label for="course">Khóa học:</label>

                <select id="course" name="course">
                    <option value="">-- Chọn khóa học --</option>
                    <option value="html-css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <div class="buttons">
                <input type="submit" value="Đăng ký">
                <input type="reset" value="Nhập lại">
            </div>

        </form>

    </div>

</body>
</html>
